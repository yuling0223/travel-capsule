<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Capsule - 照片背景上傳版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drop-target-before {
            border-top: 3px solid #3b82f6 !important;
            transition: border 0.1s ease;
        }
        .drop-target-after {
            border-bottom: 3px solid #3b82f6 !important;
            transition: border 0.1s ease;
        }
        .dragging {
            opacity: 0.3;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 select-none">

    <div class="max-w-4xl mx-auto px-4 py-6">
        <!-- 頂部標題與按鈕區 -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
            <div>
                <h1 id="main-title" class="text-xl sm:text-2xl font-bold text-slate-900">📦 Travel Capsule</h1>
                <p id="main-subtitle" class="text-xs sm:text-sm text-slate-500">照片背景上傳與雲端同步工具</p>
            </div>
            <div id="header-actions" class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                <button onclick="fetchDataFromGitHub()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition" title="重新同步資料">
                    🔄 同步
                </button>
                <button onclick="openConfigModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition">
                    ⚙️ 設定
                </button>
                <button onclick="openNewCapsuleModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition shadow-sm">
                    + 新旅行包裝
                </button>
            </div>
        </header>

        <!-- 連線狀態提示 -->
        <div id="status-banner" class="mb-4 p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-xs flex justify-between items-center hidden">
            <span id="status-text">尚未設定 GitHub 憑證</span>
            <button onclick="openConfigModal()" class="underline font-bold">立即設定</button>
        </div>

        <div id="loading-text" class="text-center py-12 text-sm text-slate-400 hidden">正在從 GitHub 同步資料...</div>

        <!-- 動態視圖容器 -->
        <div id="app-view">
            <!-- 畫面會由 JavaScript 動態渲染 -->
        </div>
    </div>

    <!-- GitHub 設定 Modal -->
    <div id="configModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-5 sm:p-6 w-full max-w-md shadow-xl my-auto">
            <h3 class="text-base sm:text-lg font-bold mb-2">⚙️ 設定 GitHub 同步</h3>
            <p class="text-xs text-slate-500 mb-4">請填入你的 GitHub 資訊，資料將自動存放在你的專案倉庫中。</p>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">GitHub 使用者名稱 (Username)</label>
                    <input type="text" id="ghUser" placeholder="例如：yuling0223" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">專案倉庫名稱 (Repository Name)</label>
                    <input type="text" id="ghRepo" placeholder="例如：travel-notes" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Personal Access Token</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeConfigModal()" class="px-4 py-2 text-xs sm:text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="saveGitHubConfig()" class="px-4 py-2 text-xs sm:text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">儲存並同步</button>
            </div>
        </div>
    </div>

    <!-- 建立新包裝 Modal -->
    <div id="capsuleModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-5 sm:p-6 w-full max-w-md shadow-xl my-auto">
            <h3 class="text-base sm:text-lg font-bold mb-4">建立新的旅行包裝</h3>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">包裝名稱</label>
                    <input type="text" id="capsuleTitleInput" placeholder="例如：2026 首爾自由行 🇰🇷" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">背景圖片上傳 (選填)</label>
                    <input type="file" id="capsuleBgFile" accept="image/*" class="w-full border rounded-lg px-3 py-2 text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeNewCapsuleModal()" class="px-4 py-2 text-xs sm:text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="createCapsule()" class="px-4 py-2 text-xs sm:text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">建立</button>
            </div>
        </div>
    </div>

    <!-- 設定/更改背景照片 Modal -->
    <div id="editBgModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-5 sm:p-6 w-full max-w-md shadow-xl my-auto">
            <h3 class="text-base sm:text-lg font-bold mb-2">🖼️ 設定行程背景照片</h3>
            <p class="text-xs text-slate-500 mb-4">從手機相簿或電腦選擇一張代表這個行程的照片。</p>
            <input type="hidden" id="editBgCapsuleId">
            <div class="space-y-3 mb-4">
                <input type="file" id="updateBgFile" accept="image/*" class="w-full border rounded-lg px-3 py-2 text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
            <div class="flex justify-between items-center">
                <button onclick="removeCapsuleBg()" class="text-xs text-red-500 hover:underline">移除背景圖</button>
                <div class="flex space-x-2">
                    <button onclick="closeEditBgModal()" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button onclick="saveCapsuleBg()" class="px-4 py-2 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700">上傳更新</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增資源 Modal -->
    <div id="itemModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-5 sm:p-6 w-full max-w-md shadow-xl my-auto max-h-[90vh] flex flex-col">
            <h3 class="text-base sm:text-lg font-bold mb-3">新增資源到包裝</h3>
            
            <div id="modalError" class="mb-3 p-2 bg-red-50 border border-red-200 text-red-600 rounded-lg text-xs hidden">
                請填寫完整名稱與內容！
            </div>

            <input type="hidden" id="targetCapsuleId">
            <div class="space-y-3 mb-4 overflow-y-auto flex-1 pr-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">自訂 Emoji 圖示</label>
                    <input type="text" id="itemEmoji" value="🌐" maxlength="2" class="w-16 border rounded-lg px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">資源類型</label>
                    <select id="itemType" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm bg-white" onchange="handleTypeChange()">
                        <option value="link">🌐 一般網頁連結 (URL)</option>
                        <option value="app">📱 喚醒手機 App (依國家選擇)</option>
                        <option value="file">📁 檔案/雲端硬碟路徑 (可貼連結)</option>
                        <option value="note">📝 隨手筆記/資訊</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">名稱 / 標題</label>
                    <input type="text" id="itemName" placeholder="例如：Naver Map 導航" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div id="contentFieldContainer">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">內容 / 網址</label>
                    <input type="text" id="itemContent" placeholder="https://..." class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100 shrink-0">
                <button onclick="closeItemModal()" class="px-4 py-2 text-xs sm:text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="createItem()" class="px-4 py-2 text-xs sm:text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">新增</button>
            </div>
        </div>
    </div>

    <!-- 防誤觸確認對話框 -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl text-center">
            <h3 id="confirmTitle" class="text-base font-bold text-slate-900 mb-2">確定要刪除嗎？</h3>
            <p id="confirmDesc" class="text-xs text-slate-500 mb-6">刪除後將同步至雲端，無法復原。</p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeConfirmModal()" class="flex-1 px-4 py-2.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">取消</button>
                <button id="confirmYesBtn" class="flex-1 px-4 py-2.5 text-xs font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl">確定刪除</button>
            </div>
        </div>
    </div>

    <script>
        let capsules = [];
        let fileSha = null;
        let currentView = 'home';
        let activeCapsuleId = null;
        let activeItemId = null;
        let isEditingItem = false;
        let draggedIndex = null;

        const countryApps = {
            kr: {
                name: "🇰🇷 韓國",
                apps: [
                    { name: "Naver Map (地圖/導航)", scheme: "navermap://" },
                    { name: "Kakao Map (地圖)", scheme: "kakaomap://" },
                    { name: "Kakao T (計程車/叫車)", scheme: "kakaot://" },
                    { name: "Papago (翻譯)", scheme: "papago://" },
                    { name: "Subway Korea (地鐵)", scheme: "subwaykorea://" }
                ]
            },
            jp: {
                name: "🇯🇵 日本",
                apps: [
                    { name: "Google Maps (地圖)", scheme: "comgooglemaps://" },
                    { name: "Yahoo!乘換案內 (地鐵/轉乘)", scheme: "yahootransit://" },
                    { name: "Suica / Apple Wallet (交通卡)", scheme: "suica://" },
                    { name: "Tabelog (美食)", scheme: "tabelog://" }
                ]
            },
            global: {
                name: "🌍 通用 / 其他",
                apps: [
                    { name: "Google Maps (地圖)", scheme: "comgooglemaps://" },
                    { name: "Uber (叫車)", scheme: "uber://" },
                    { name: "Google Translate (翻譯)", scheme: "googletranslate://" },
                    { name: "Airbnb (住宿)", scheme: "airbnb://" }
                ]
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (user && repo && token) {
                fetchDataFromGitHub();
            } else {
                document.getElementById('status-banner').classList.remove('hidden');
                render();
            }
        });

        function openConfigModal() {
            document.getElementById('ghUser').value = localStorage.getItem('gh_user') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            document.getElementById('configModal').classList.remove('hidden');
        }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

        function saveGitHubConfig() {
            const user = document.getElementById('ghUser').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            if (!user || !repo || !token) return alert('請完整填寫所有欄位');

            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);
            closeConfigModal();
            document.getElementById('status-banner').classList.add('hidden');
            fetchDataFromGitHub();
        }

        async function fetchDataFromGitHub() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!user || !repo || !token) return;

            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
            document.getElementById('loading-text').classList.remove('hidden');

            try {
                const response = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (response.status === 404) {
                    capsules = [];
                    fileSha = null;
                } else if (response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    const decodedContent = decodeURIComponent(escape(atob(data.content)));
                    capsules = JSON.parse(decodedContent);
                }
            } catch (e) {
                console.error(e);
            }

            document.getElementById('loading-text').classList.add('hidden');
            render();
        }

        async function saveDataToGitHub() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!user || !repo || !token) return;

            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
            const jsonString = JSON.stringify(capsules, null, 2);
            const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyData = {
                message: "Update travel capsules data and images",
                content: base64Content
            };
            if (fileSha) bodyData.sha = fileSha;

            try {
                const response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (response.ok) {
                    const resData = await response.json();
                    fileSha = resData.content.sha;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function goToHome() {
            currentView = 'home';
            activeCapsuleId = null;
            activeItemId = null;
            isEditingItem = false;
            render();
        }

        function goToDetail(capsuleId) {
            currentView = 'detail';
            activeCapsuleId = capsuleId;
            activeItemId = null;
            isEditingItem = false;
            render();
        }

        function goToItemDetail(capsuleId, itemId) {
            currentView = 'itemDetail';
            activeCapsuleId = capsuleId;
            activeItemId = itemId;
            isEditingItem = false;
            render();
        }

        function render() {
            const container = document.getElementById('app-view');
            const titleEl = document.getElementById('main-title');
            const subtitleEl = document.getElementById('main-subtitle');

            if (currentView === 'home') {
                titleEl.textContent = "📦 Travel Capsule";
                subtitleEl.textContent = "選擇你的旅行包裝或建立新行程（可按住 ☰ 拖曳排序）";
                
                if (capsules.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 p-6 shadow-sm">
                            <p class="text-sm text-slate-400 mb-3">目前沒有任何旅行包裝</p>
                            <button onclick="openNewCapsuleModal()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">建立第一個包裝</button>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="space-y-3" id="sortable-container">';
                capsules.forEach((cap, index) => {
                    const itemCount = (cap.items || []).length;
                    const bgStyle = cap.bgUrl ? `style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), url('${cap.bgUrl}'); background-size: cover; background-position: center;"` : '';
                    const textColor = cap.bgUrl ? 'text-white' : 'text-slate-800';
                    const subTextColor = cap.bgUrl ? 'text-slate-200' : 'text-slate-400';
                    const handleColor = cap.bgUrl ? 'text-white/70 hover:text-white' : 'text-slate-300 hover:text-slate-600';

                    html += `
                        <div draggable="true" 
                             data-index="${index}"
                             class="sortable-item bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition flex justify-between items-center group cursor-pointer relative overflow-hidden"
                             ${bgStyle}
                             onclick="goToDetail('${cap.id}')">
                            <div class="flex items-center space-x-3 overflow-hidden z-10">
                                <span class="drag-handle ${handleColor} cursor-move px-2 py-1 text-base select-none font-bold" title="按住拖拉">☰</span>
                                <div class="truncate">
                                    <h2 class="font-bold ${textColor} text-base transition truncate">${cap.title}</h2>
                                    <p class="text-xs ${subTextColor} mt-0.5">包含 ${itemCount} 項資源與 App 捷徑</p>
                                </div>
                            </div>
                            <span class="${textColor} font-bold text-lg shrink-0 ml-2 z-10">›</span>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
                initDragAndDrop('capsule');

            } else if (currentView === 'detail') {
                const target = capsules.find(c => c.id == activeCapsuleId);
                if (!target) { goToHome(); return; }

                titleEl.textContent = target.title;
                subtitleEl.textContent = "行程專屬網頁、App 喚醒與備忘錄（可按住 ☰ 拖曳排序）";

                let itemsHtml = (target.items || []).map((item, index) => {
                    let actionHtml = '';
                    const emoji = item.emoji || '🌐';
                    
                    if (item.type === 'link') {
                        actionHtml = `<a href="${item.content}" target="_blank" class="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-xl font-medium" onclick="event.stopPropagation()">開啟</a>`;
                    } else if (item.type === 'app') {
                        actionHtml = `<a href="${item.content}" class="text-xs bg-purple-50 text-purple-600 px-3 py-1.5 rounded-xl font-medium" onclick="event.stopPropagation()">喚醒 App</a>`;
                    } else if (item.type === 'file') {
                        if (item.content.startsWith('http')) {
                            actionHtml = `<a href="${item.content}" target="_blank" class="text-xs bg-amber-50 text-amber-600 px-3 py-1.5 rounded-xl font-medium" onclick="event.stopPropagation()">開啟檔案</a>`;
                        } else {
                            actionHtml = `<span class="text-xs bg-amber-50 text-amber-600 px-2.5 py-1 rounded-xl font-mono">路徑</span>`;
                        }
                    } else if (item.type === 'note') {
                        actionHtml = `<span class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-xl">備忘</span>`;
                    }

                    return `
                        <div draggable="true"
                             data-index="${index}"
                             class="sortable-item flex items-center justify-between p-3.5 bg-white rounded-2xl border border-slate-100 shadow-sm hover:border-blue-300 transition cursor-pointer group"
                             onclick="goToItemDetail('${target.id}', '${item.id}')">
                            <div class="flex items-center space-x-3 overflow-hidden mr-2">
                                <span class="drag-handle text-slate-300 hover:text-slate-600 cursor-move px-2 py-1 text-sm select-none font-bold" title="按住拖拉">☰</span>
                                <span class="text-base shrink-0">${emoji}</span>
                                <div class="truncate">
                                    <p class="text-xs font-bold text-slate-700 group-hover:text-blue-600 truncate">${item.name}</p>
                                    <p class="text-[11px] text-slate-400 truncate">${item.content}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 shrink-0">
                                ${actionHtml}
                                <button onclick="event.stopPropagation(); confirmDeleteItem('${target.id}', '${item.id}')" class="text-slate-300 hover:text-red-500 px-1 text-base">×</button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="mb-4 flex justify-between items-center">
                        <button onclick="goToHome()" class="inline-flex items-center text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-xl transition">
                            ⬅️ 返回清單
                        </button>
                        <div class="flex items-center space-x-3">
                            <button onclick="openEditBgModal('${target.id}')" class="text-xs text-slate-500 hover:text-blue-600 font-medium">
                                🖼️ 設定背景照片
                            </button>
                            <button onclick="confirmDeleteCapsule('${target.id}')" class="text-xs text-slate-400 hover:text-red-500 font-medium">
                                刪除此包裝
                            </button>
                        </div>
                    </div>

                    <div class="space-y-3 mb-4" id="sortable-container">
                        ${itemsHtml || '<p class="text-xs text-slate-400 text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">這個包裝還空空如也，快點下方新增資料吧！</p>'}
                    </div>

                    <button onclick="openItemModal('${target.id}')" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-xs font-bold shadow-sm transition">
                        + 新增資源 / 喚醒 App 到此包裝
                    </button>
                `;
                initDragAndDrop('item');

            } else if (currentView === 'itemDetail') {
                const targetCapsule = capsules.find(c => c.id == activeCapsuleId);
                if (!targetCapsule) { goToHome(); return; }
                const targetItem = (targetCapsule.items || []).find(i => i.id == activeItemId);
                if (!targetItem) { goToDetail(activeCapsuleId); return; }

                titleEl.textContent = targetItem.name;
                subtitleEl.textContent = "資源詳細資訊";

                let openDirectButton = '';
                if (targetItem.type === 'file' && targetItem.content.startsWith('http')) {
                    openDirectButton = `<a href="${targetItem.content}" target="_blank" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm inline-flex items-center">📁 開啟雲端檔案</a>`;
                } else if (targetItem.type === 'link') {
                    openDirectButton = `<a href="${targetItem.content}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm inline-flex items-center">🌐 前往網頁</a>`;
                }

                container.innerHTML = `
                    <div class="mb-4 flex justify-between items-center">
                        <button onclick="goToDetail('${targetCapsule.id}')" class="inline-flex items-center text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-xl transition">
                            ⬅️ 返回包裝
                        </button>
                        <div class="flex items-center space-x-2">
                            ${openDirectButton}
                            ${!isEditingItem ? `
                                <button onclick="toggleEditItem(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition">
                                    ✏️ 編輯
                                </button>
                            ` : `
                                <button onclick="saveEditedItem('${targetCapsule.id}', '${targetItem.id}')" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">
                                    💾 儲存
                                </button>
                            `}
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <div class="flex space-x-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Emoji</label>
                                ${isEditingItem ? `
                                    <input type="text" id="editItemEmoji" value="${targetItem.emoji || '🌐'}" maxlength="2" class="w-16 border rounded-xl px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                ` : `
                                    <p class="text-xl">${targetItem.emoji || '🌐'}</p>
                                `}
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">資源類型</label>
                                <p class="text-xs font-bold text-slate-700 uppercase mt-2">${targetItem.type}</p>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">名稱 / 標題</label>
                            ${isEditingItem ? `
                                <input type="text" id="editItemName" value="${targetItem.name}" class="w-full border rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            ` : `
                                <p class="text-sm font-bold text-slate-800">${targetItem.name}</p>
                            `}
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">內容 / 網址 / 路徑 / 筆記</label>
                            ${isEditingItem ? `
                                <textarea id="editItemContent" rows="5" class="w-full border rounded-xl p-3 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${targetItem.content}</textarea>
                            ` : `
                                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-700 break-all whitespace-pre-wrap">${targetItem.content}</div>
                            `}
                        </div>
                    </div>
                `;
            }
        }

        // --- 直覺的兩項之間插入線拖曳排序引擎 ---
        function initDragAndDrop(type) {
            const container = document.getElementById('sortable-container');
            if (!container) return;
            const items = container.querySelectorAll('.sortable-item');

            items.forEach(item => {
                const handle = item.querySelector('.drag-handle');

                item.addEventListener('dragstart', (e) => {
                    draggedIndex = parseInt(item.getAttribute('data-index'));
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    clearHighlights();
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const rect = item.getBoundingClientRect();
                    const midpoint = rect.top + rect.height / 2;
                    
                    clearHighlights();
                    if (e.clientY < midpoint) {
                        item.classList.add('drop-target-before');
                    } else {
                        item.classList.add('drop-target-after');
                    }
                });

                item.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    const targetIndex = parseInt(item.getAttribute('data-index'));
                    const rect = item.getBoundingClientRect();
                    const midpoint = rect.top + rect.height / 2;
                    let finalTargetIndex = targetIndex;

                    if (e.clientY >= midpoint) {
                        finalTargetIndex = targetIndex + 1;
                    }

                    if (draggedIndex !== null) {
                        if (type === 'capsule') {
                            const moved = capsules.splice(draggedIndex, 1)[0];
                            if (draggedIndex < finalTargetIndex) finalTargetIndex--;
                            capsules.splice(finalTargetIndex, 0, moved);
                        } else {
                            const targetCapsule = capsules.find(c => c.id == activeCapsuleId);
                            if (targetCapsule && targetCapsule.items) {
                                const moved = targetCapsule.items.splice(draggedIndex, 1)[0];
                                if (draggedIndex < finalTargetIndex) finalTargetIndex--;
                                targetCapsule.items.splice(finalTargetIndex, 0, moved);
                            }
                        }
                        draggedIndex = null;
                        render();
                        await saveDataToGitHub();
                    }
                });

                // 手機觸控支援
                handle.addEventListener('touchstart', (e) => {
                    draggedIndex = parseInt(item.getAttribute('data-index'));
                    item.classList.add('dragging');
                }, {passive: true});

                handle.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    const dropTarget = elementBelow ? elementBelow.closest('.sortable-item') : null;

                    clearHighlights();
                    if (dropTarget) {
                        const rect = dropTarget.getBoundingClientRect();
                        if (touch.clientY < rect.top + rect.height / 2) {
                            dropTarget.classList.add('drop-target-before');
                        } else {
                            dropTarget.classList.add('drop-target-after');
                        }
                    }
                }, {passive: false});

                handle.addEventListener('touchend', async (e) => {
                    item.classList.remove('dragging');
                    const touch = e.changedTouches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    const dropTarget = elementBelow ? elementBelow.closest('.sortable-item') : null;

                    if (dropTarget && draggedIndex !== null) {
                        const targetIndex = parseInt(dropTarget.getAttribute('data-index'));
                        const rect = dropTarget.getBoundingClientRect();
                        let finalTargetIndex = targetIndex;

                        if (touch.clientY >= rect.top + rect.height / 2) {
                            finalTargetIndex = targetIndex + 1;
                        }

                        if (type === 'capsule') {
                            const moved = capsules.splice(draggedIndex, 1)[0];
                            if (draggedIndex < finalTargetIndex) finalTargetIndex--;
                            capsules.splice(finalTargetIndex, 0, moved);
                        } else {
                            const targetCapsule = capsules.find(c => c.id == activeCapsuleId);
                            if (targetCapsule && targetCapsule.items) {
                                const moved = targetCapsule.items.splice(draggedIndex, 1)[0];
                                if (draggedIndex < finalTargetIndex) finalTargetIndex--;
                                targetCapsule.items.splice(finalTargetIndex, 0, moved);
                            }
                        }
                        draggedIndex = null;
                        render();
                        await saveDataToGitHub();
                    }
                    clearHighlights();
                });
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.sortable-item').forEach(i => {
                i.classList.remove('drop-target-before', 'drop-target-after', 'dragging');
            });
        }
        // -------------------------------------------------------------

        function toggleEditItem(status) {
            isEditingItem = status;
            render();
        }

        async function saveEditedItem(capsuleId, itemId) {
            const newName = document.getElementById('editItemName').value.trim();
            const newContent = document.getElementById('editItemContent').value.trim();
            const newEmoji = document.getElementById('editItemEmoji').value.trim() || '🌐';

            if (!newName || !newContent) {
                alert('名稱與內容不得為空！');
                return;
            }

            const targetCapsule = capsules.find(c => c.id == capsuleId);
            if (targetCapsule) {
                const targetItem = targetCapsule.items.find(i => i.id == itemId);
                if (targetItem) {
                    targetItem.name = newName;
                    targetItem.content = newContent;
                    targetItem.emoji = newEmoji;
                }
            }

            isEditingItem = false;
            render();
            await saveDataToGitHub();
        }

        function openNewCapsuleModal() {
            document.getElementById('capsuleModal').classList.remove('hidden');
            document.getElementById('capsuleTitleInput').value = '';
            document.getElementById('capsuleBgFile').value = '';
            document.getElementById('capsuleTitleInput').focus();
        }
        function closeNewCapsuleModal() { document.getElementById('capsuleModal').classList.add('hidden'); }

        async function createCapsule() {
            const title = document.getElementById('capsuleTitleInput').value.trim();
            const fileInput = document.getElementById('capsuleBgFile');
            if (!title) return alert('請輸入包裝名稱');

            let bgUrl = '';
            if (fileInput.files && fileInput.files[0]) {
                bgUrl = await toBase64(fileInput.files[0]);
            }
            
            const newCap = {
                id: Date.now().toString(),
                title: title,
                bgUrl: bgUrl,
                items: []
            };
            capsules.push(newCap);
            closeNewCapsuleModal();
            goToDetail(newCap.id);
            await saveDataToGitHub();
        }

        // 圖片轉換 Base64 輔助函式
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 開啟背景圖片設定 Modal
        function openEditBgModal(capsuleId) {
            document.getElementById('editBgCapsuleId').value = capsuleId;
            document.getElementById('updateBgFile').value = '';
            document.getElementById('editBgModal').classList.remove('hidden');
        }
        function closeEditBgModal() { document.getElementById('editBgModal').classList.add('hidden'); }

        async function saveCapsuleBg() {
            const capsuleId = document.getElementById('editBgCapsuleId').value;
            const fileInput = document.getElementById('updateBgFile');
            const target = capsules.find(c => c.id == capsuleId);

            if (target && fileInput.files && fileInput.files[0]) {
                target.bgUrl = await toBase64(fileInput.files[0]);
                closeEditBgModal();
                render();
                await saveDataToGitHub();
            } else {
                alert('請先選擇一張照片！');
            }
        }

        async function removeCapsuleBg() {
            const capsuleId = document.getElementById('editBgCapsuleId').value;
            const target = capsules.find(c => c.id == capsuleId);
            if (target) {
                target.bgUrl = '';
                closeEditBgModal();
                render();
                await saveDataToGitHub();
            }
        }

        function confirmDeleteCapsule(id) {
            document.getElementById('confirmTitle').textContent = "確定要刪除這個旅行包裝嗎？";
            document.getElementById('confirmDesc').textContent = "刪除後該包裝內的所有資料將同步移除。";
            document.getElementById('confirmYesBtn').onclick = async function() {
                closeConfirmModal();
                capsules = capsules.filter(c => c.id !== id);
                goToHome();
                await saveDataToGitHub();
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function confirmDeleteItem(capsuleId, itemId) {
            document.getElementById('confirmTitle').textContent = "確定要刪除這個項目嗎？";
            document.getElementById('confirmDesc').textContent = "刪除後將無法復原。";
            document.getElementById('confirmYesBtn').onclick = async function() {
                closeConfirmModal();
                const target = capsules.find(c => c.id == capsuleId);
                if (target) {
                    target.items = target.items.filter(i => i.id !== itemId);
                    render();
                    await saveDataToGitHub();
                }
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() { document.getElementById('confirmModal').classList.add('hidden'); }

        function openItemModal(capsuleId) {
            document.getElementById('targetCapsuleId').value = capsuleId;
            document.getElementById('itemName').value = '';
            document.getElementById('itemEmoji').value = '🌐';
            document.getElementById('itemType').value = 'link';
            document.getElementById('modalError').classList.add('hidden');
            handleTypeChange();
            document.getElementById('itemModal').classList.remove('hidden');
        }
        function closeItemModal() { document.getElementById('itemModal').classList.add('hidden'); }

        function handleTypeChange() {
            const type = document.getElementById('itemType').value;
            const container = document.getElementById('contentFieldContainer');
            
            if (type === 'app') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-500 mb-1">1. 選擇國家</label>
                    <select id="appCountrySelect" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm bg-white mb-2" onchange="updateAppOptions()">
                        <option value="kr">🇰🇷 韓國</option>
                        <option value="jp">🇯🇵 日本</option>
                        <option value="global">🌍 通用 / 其他</option>
                    </select>

                    <label class="block text-xs font-semibold text-slate-500 mb-1">2. 選擇常用 App</label>
                    <select id="appSchemeSelect" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm bg-white mb-2">
                        <!-- 動態帶入 -->
                    </select>

                    <label class="block text-xs font-semibold text-slate-500 mb-1">3. 或手動輸入自訂 Scheme (選填)</label>
                    <input type="text" id="customAppInput" placeholder="例如：instagram://" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                `;
                updateAppOptions();
            } else if (type === 'file') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-500 mb-1">雲端硬碟連結 (建議貼上網址)</label>
                    <input type="text" id="itemContent" placeholder="https://drive.google.com/..." class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                `;
            } else {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-500 mb-1">內容 / 網址 / 備忘說明</label>
                    <input type="text" id="itemContent" placeholder="https://... 或 文字說明" class="w-full border rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                `;
            }
        }

        function updateAppOptions() {
            const countryKey = document.getElementById('appCountrySelect').value;
            const appSelect = document.getElementById('appSchemeSelect');
            const apps = countryApps[countryKey].apps;

            appSelect.innerHTML = '';
            apps.forEach(app => {
                const opt = document.createElement('option');
                opt.value = app.scheme;
                opt.textContent = app.name;
                appSelect.appendChild(opt);
            });
        }

        async function createItem() {
            const capsuleId = document.getElementById('targetCapsuleId').value;
            const type = document.getElementById('itemType').value;
            const name = document.getElementById('itemName').value.trim();
            const emoji = document.getElementById('itemEmoji').value.trim() || '🌐';
            const errorBox = document.getElementById('modalError');
            
            let content = '';
            if (type === 'app') {
                const customInput = document.getElementById('customAppInput');
                const schemeSelect = document.getElementById('appSchemeSelect');
                content = customInput && customInput.value.trim() ? customInput.value.trim() : (schemeSelect ? schemeSelect.value : '');
            } else {
                const contentInput = document.getElementById('itemContent');
                content = contentInput ? contentInput.value.trim() : '';
            }

            if (!name || !content) {
                errorBox.classList.remove('hidden');
                return;
            }
            errorBox.classList.add('hidden');

            const target = capsules.find(c => c.id == capsuleId);
            if (target) {
                if (!target.items) target.items = [];
                target.items.push({
                    id: Date.now().toString(),
                    type,
                    name,
                    content,
                    emoji
                });
                closeItemModal();
                render();
                await saveDataToGitHub();
            }
        }
    </script>
</body>
